---
- name: Deploy to UAT
  hosts: uat
  become: false

  tasks:
    - name: Stop application
      ansible.builtin.shell: ~/togo/stop.sh
      ignore_errors: true

    - name: Copy jar to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../build/libs/share_api-0.0.1.jar"
        dest: ~/togo/share_api-0.0.1.jar
        mode: '0755'

    - name: Start application
      ansible.builtin.shell: ~/togo/start.sh
